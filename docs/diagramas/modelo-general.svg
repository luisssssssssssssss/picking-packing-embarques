>ShipmentUnit</text><text x="444" y="1071" font-size="18" fill="#b76520">HU en una parada</text><text x="444" y="1103" font-size="16" fill="#43566c">PK Id</text><text x="444" y="1127" font-size="16" fill="#43566c">FK ShipmentId / StopId</text><text x="444" y="1151" font-size="16" fill="#43566c">FK HandlingUnitId</text><path d="M759 1097 H797" fill="none" stroke="#66778b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="780" y="1081" text-anchor="middle" font-size="14" fill="#43566c">1:N</text><rect x="804" y="1015" width="328" height="152" rx="8" fill="#ffffff" stroke="#d2dae5"/><rect x="804" y="1015" width="5" height="152" fill="#b76520"/><text x="820" y="1044" font-size="21" font-weight="700">LoadEvent</text><text x="820" y="1071" font-size="18" fill="#b76520">Carga o descarga correctiva</text><text x="820" y="1103" font-size="16" fill="#43566c">PK Id</text><text x="820" y="1127" font-size="16" fill="#43566c">FK ShipmentUnitId</text><text x="820" y="1151" font-size="16" fill="#43566c">Usuario y comando</text><rect x="1180" y="1015" width="328" height="152" rx="8" fill="#ffffff" stroke="#d2dae5"/><rect x="1180" y="1015" width="5" height="152" fill="#b76520"/><text x="1196" y="1044" font-size="21" font-weight="700">ShipmentClosure</text><text x="1196" y="1071" font-size="18" fill="#b76520">Acta de cierre</text><text x="1196" y="1103" font-size="16" fill="#43566c">PK Id</text><text x="1196" y="1127" font-size="16" fill="#43566c">FK ShipmentId único</text><text x="1196" y="1151" font-size="16" fill="#43566c">Manifiesto histórico</text><path d="M216 1167 V1210 H1344 V1171" fill="none" stroke="#66778b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="602" y="1197" width="344" height="26" fill="#f7f9fc"/><text x="774" y="1216" text-anchor="middle" font-size="17" fill="#43566c">Un embarque tiene como máximo un cierre</text><text x="52" y="1280" font-size="18" font-weight="700">Relaciones entre recorridos</text><text x="52" y="1307" font-size="17" fill="#43566c">Un detalle de Picking tiene varias confirmaciones. Una asignación de surtido puede repartirse entre varias paradas.</text><text x="52" y="1340" font-size="18" font-weight="700">Protección de la carga</text><text x="52" y="1367" font-size="17" fill="#43566c">Una HU solo tiene una asignación activa de embarque; cada aporte consume cantidad del compromiso de su parada.</text><text x="52" y="1400" font-size="18" font-weight="700">Controles transversales</text><text x="52" y="1427" font-size="17" fill="#43566c">Catálogos, importación, permisos, incidencias, bloqueos, reversiones e idempotencia se detallan en los diagramas por módulo.</text><text x="52" y="1464" font-size="15" fill="#64758b">Vista resumida. El diccionario contiene los 657 campos, las FKs compuestas y las reglas que no se representan en este mapa.</text></g></svg>